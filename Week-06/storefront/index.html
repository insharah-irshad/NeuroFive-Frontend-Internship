<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IF Ateliers — Kurtis, Outfits &amp; Bags</title>
<meta name="description" content="IF Ateliers — modest fashion kurtis, outfits, and bags, designed for everyday elegance." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="wordmark" aria-label="IF Ateliers home">
        <span class="wordmark-mark">IF</span>IF Ateliers
      </a>

      <div class="header-tools">
        <div class="search-field">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.4"/>
            <line x1="11.1" y1="11.1" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search the collection…" aria-label="Search products" />
        </div>

        <select id="category-select" aria-label="Filter by category">
          <option value="all">All Categories</option>
        </select>

        <button id="cart-toggle" class="cart-toggle" aria-label="Open cart" aria-haspopup="dialog">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M2.5 5.5H4.2L5.9 13.7A1.5 1.5 0 0 0 7.36 15H15a1.5 1.5 0 0 0 1.46-1.16L18 7H5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="18" r="1.15" fill="currentColor"/>
            <circle cx="15" cy="18" r="1.15" fill="currentColor"/>
          </svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== App mount ===== -->
  <main id="app" class="app-root" aria-live="polite"></main>

  <!-- ===== Cart Drawer ===== -->
  <div id="cart-drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Shopping cart" role="dialog" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your Basket</h2>
      <button id="cart-close" class="icon-btn" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="drawer-foot">
      <div class="drawer-total">
        <span>Subtotal</span>
        <strong id="cart-subtotal">$0.00</strong>
      </div>
      <a href="#/checkout" class="btn btn-primary btn-block" id="checkout-link">Checkout</a>
    </div>
  </aside>

  <!-- ===== Modal + Toast mounts ===== -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <footer class="site-footer">
    <p>IF Ateliers — a capstone storefront project. Kurtis, outfits &amp; bags, modelled in-app as fabric-swatch line art.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
